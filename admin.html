<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel interno — KAEL</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logomark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  table { width:100%; border-collapse: collapse; background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:top; }
  th { background:#FAF8F3; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  select.status { font-size:12px; padding:4px 6px; }
  .importe-cell { display:flex; gap:6px; align-items:center; }
  .importe-cell input { font-size:12px; padding:4px 6px; width:110px; border:1px solid var(--border); border-radius:6px; }
  .importe-cell button { font-size:11px; padding:4px 8px; border:1px solid var(--border); border-radius:6px; background:#fff; cursor:pointer; }
  .importe-cell button:hover { background:var(--card-alt); }
  .save-status { font-size:11px; color:var(--muted); }
</style>
</head>
<body data-page="admin">
<header class="site-header" id="site-header"></header>
<main class="container" style="padding-top:28px; padding-bottom:96px;">
  <h1 style="font-size:28px; font-weight:500;" data-i18n="admin.h1">Panel interno — solicitudes</h1>
  <p style="font-size:14px; color:var(--muted); margin:6px 0 24px;" data-i18n="admin.desc">Backoffice mínimo (MVP). Requiere que el servidor de server/ esté desplegado y ADMIN_USER/ADMIN_PASS configurados. Tu navegador te pedirá usuario y contraseña.</p>
  <div id="statsRow" style="display:flex; gap:24px; margin-bottom:24px; flex-wrap:wrap;"></div>
  <div style="overflow-x:auto;">
    <table id="leadsTable">
      <thead>
        <tr>
          <th data-i18n="admin.thRef">Referencia</th><th data-i18n="admin.thFecha">Fecha creación</th><th data-i18n="admin.thBarcos">Barco(s)</th><th data-i18n="admin.thCliente">Cliente</th><th data-i18n="admin.thContacto">Contacto</th>
          <th data-i18n="admin.thFechaSol">Fecha solicitada</th><th data-i18n="admin.thPersonas">Personas</th><th data-i18n="admin.thEstado">Estado</th><th data-i18n="admin.thImporte">Importe</th>
        </tr>
      </thead>
      <tbody id="leadsBody"><tr><td colspan="9" data-i18n="admin.cargando">Cargando…</td></tr></tbody>
    </table>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/partials.js"></script>
<script>renderHeader(document.getElementById('site-header'), ''); applyI18n();</script>
<script>
(function () {
  var base = window.KAEL_API_BASE || '/api';
  var ESTADOS = ['pendiente_de_empresa', 'contactado', 'confirmada', 'rechazada', 'cancelada'];

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function statCard(n, label) {
    return '<div class="card card-pad" style="min-width:160px;"><div style="font-size:28px; font-weight:500;">' + n + '</div><div style="font-size:13px; color:var(--muted); margin-top:4px;">' + label + '</div></div>';
  }

  function statusOptions(current) {
    return ESTADOS.map(function (s) {
      return '<option value="' + s + '"' + (s === current ? ' selected' : '') + '>' + escapeHtml(t('admin.estados.' + s)) + '</option>';
    }).join('');
  }

  function loadLeads() {
    var body = document.getElementById('leadsBody');
    return fetch(base + '/admin/solicitudes').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (leads) {
      if (!leads.length) { body.innerHTML = '<tr><td colspan="9">' + t('admin.sinSolicitudes') + '</td></tr>'; return; }

      var pending = leads.filter(function (l) { return l.status === 'pendiente_de_empresa'; }).length;
      var confirmed = leads.filter(function (l) { return l.status === 'confirmada'; }).length;
      document.getElementById('statsRow').innerHTML =
        statCard(leads.length, t('admin.statTotales')) +
        statCard(pending, t('admin.statPendientes')) +
        statCard(confirmed, t('admin.statConfirmadas'));

      body.innerHTML = '';
      leads.forEach(function (l) {
        var tr = document.createElement('tr');
        tr.setAttribute('data-ref', l.ref);
        tr.innerHTML =
          '<td class="mono">' + escapeHtml(l.ref) + '</td>' +
          '<td>' + escapeHtml(new Date(l.createdAt).toLocaleString('es-ES')) + '</td>' +
          '<td>' + escapeHtml((l.boatIds || []).join(', ')) + '</td>' +
          '<td>' + escapeHtml(l.nombre) + '</td>' +
          '<td>' + escapeHtml(l.email) + '<br>' + escapeHtml(l.telefono) + '</td>' +
          '<td>' + escapeHtml(l.fecha) + '</td>' +
          '<td>' + escapeHtml(l.personas) + '</td>' +
          '<td><select class="status">' + statusOptions(l.status) + '</select></td>' +
          '<td><div class="importe-cell">' +
            '<input type="text" class="importe-input" placeholder="' + escapeHtml(t('admin.importePlaceholder')) + '" value="' + escapeHtml(l.importeFinal || '') + '">' +
            '<button type="button" class="save-btn">' + escapeHtml(t('admin.guardar')) + '</button>' +
            '<span class="save-status"></span>' +
          '</div></td>';
        body.appendChild(tr);
      });
    }).catch(function (err) {
      body.innerHTML = '<tr><td colspan="9">' + t('admin.errorCarga') + escapeHtml(err.message) + '</td></tr>';
    });
  }

  document.getElementById('leadsBody').addEventListener('click', function (e) {
    var btn = e.target.closest('.save-btn');
    if (!btn) return;
    var tr = btn.closest('tr');
    var ref = tr.getAttribute('data-ref');
    var status = tr.querySelector('.status').value;
    var importeFinal = tr.querySelector('.importe-input').value.trim();
    var statusEl = tr.querySelector('.save-status');
    btn.disabled = true;
    statusEl.textContent = t('admin.guardando');
    fetch(base + '/admin/solicitudes/' + encodeURIComponent(ref), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: status, importeFinal: importeFinal })
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function () {
      statusEl.textContent = t('admin.guardado');
      btn.disabled = false;
      setTimeout(function () { statusEl.textContent = ''; }, 2500);
    }).catch(function () {
      statusEl.textContent = t('admin.errorGuardar');
      btn.disabled = false;
    });
  });

  loadLeads();
})();
</script>
</body>
</html>
